<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			* {
				box-sizing: border-box;
			}
			html,
			body {
				width: 440px;
				height: 280px;
				margin: 0;
				overflow: hidden;
			}
			body {
				position: relative;
				display: grid;
				grid-template-columns: 158px 1fr;
				align-items: center;
				padding: 24px 28px 24px 20px;
				background: linear-gradient(rgba(24, 23, 19, 0.045) 1px, transparent 1px), #f3ead8;
				background-size: 100% 7px;
				color: #181713;
			}
			body::after {
				position: absolute;
				inset: 10px;
				border: 1px solid #181713;
				content: '';
				pointer-events: none;
			}
			img {
				width: 144px;
				height: 144px;
				object-fit: contain;
				transform: rotate(-5deg);
			}
			.copy {
				position: relative;
				z-index: 1;
			}
			h1 {
				margin: 0;
				font:
					700 74px/0.8 Georgia,
					serif;
				letter-spacing: -0.09em;
			}
			p {
				margin: 19px 0 0 4px;
				color: #991f17;
				font:
					800 13px/1.25 'Arial Narrow',
					sans-serif;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<img src="assets/beef-icon-master.png" alt="" />
		<div class="copy">
			<h1>beef</h1>
			<p>PR review,<br />cut down.</p>
		</div>
	</body>
</html>
