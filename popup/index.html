<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<title>beef</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<span class="brand-mark" aria-hidden="true">B</span>
			<strong>beef</strong>
			<span class="status" id="status">Ready</span>
		</header>

		<main>
			<button class="review-button" id="review" type="button">
				<span>Review</span><span aria-hidden="true">→</span>
			</button>
			<button class="settings-button" id="settings" type="button">
				<span>Settings</span><span aria-hidden="true">↗</span>
			</button>
			<p class="message" id="message" aria-live="polite"></p>
		</main>

		<dialog id="consent-dialog" aria-labelledby="consent-title">
			<p class="dialog-eyebrow">Before the first review</p>
			<h2 id="consent-title">Send this PR to TypeSafe?</h2>
			<p>
				Beef sends the current PR title, description, filenames, and diff content to TypeSafe AI for
				classification. This can include private repository code.
			</p>
			<a href="../privacy.html" target="_blank">Privacy details ↗</a>
			<div class="dialog-actions">
				<button id="consent-cancel" type="button">Cancel</button>
				<button id="consent-confirm" type="button">Agree &amp; review</button>
			</div>
		</dialog>

		<script type="module" src="app.js"></script>
	</body>
</html>
